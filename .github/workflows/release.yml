name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          section_file="$(mktemp)"
          bash scripts/extract-changelog-section.sh "$version" CHANGELOG.md > "$section_file"
          {
            echo "Template snapshot \`${tag}\`."
            echo
            echo "This release has no application binaries."
            echo
            echo "## Notes from CHANGELOG.md"
            echo
            if [[ -s "$section_file" ]]; then
              cat "$section_file"
            else
              echo "_No matching \`## [${version}]\` section found in CHANGELOG.md; see the file for history._"
            fi
          } > "$notes_file"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$notes_file" \
            --verify-tag
