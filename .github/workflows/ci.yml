name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate template
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run template validator
        run: bash scripts/validate-template.sh

      - name: Run validator tests
        run: bash tests/test_validate_template.sh

  shellcheck-scripts:
    name: Shell syntax check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bash -n on scripts and tests
        run: |
          set -euo pipefail
          bash -n scripts/validate-template.sh
          bash -n tests/test_validate_template.sh
          echo "shell syntax: OK"
