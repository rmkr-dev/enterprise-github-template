name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run template validator
        run: bash scripts/validate-template.sh

      - name: Run validator tests
        run: bash tests/test_validate_template.sh
